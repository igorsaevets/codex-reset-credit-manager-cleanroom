[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-reset-credit-manager"
version = "0.1.0"
description = "Public read-only MVP of a Windows-first Codex reset credit manager."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Igor Saevets" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
codex-reset-credit-manager = "codex_reset_credit_manager.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
